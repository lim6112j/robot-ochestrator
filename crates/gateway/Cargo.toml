[package]
name = "gateway"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "VDA 5050 gateway: MQTT ingest, schema validation, canonical model, REST/WS API and digital twin dashboard"

[[bin]]
name = "gateway"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
vda5050-types = { path = "../vda5050-types" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "signal", "sync"] }
rumqttc = "0.25"
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["fs", "trace"] }
tracing = "0.1"
thiserror = "2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
futures-util = "0.3"
