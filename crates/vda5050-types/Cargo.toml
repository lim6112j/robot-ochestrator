[package]
name = "vda5050-types"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "VDA 5050 v3.0.0 message types and JSON Schema validation"

[lints]
workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# No `resolve-http`: the VDA 5050 schemas are self-contained, and fetching remote
# `$ref`s would need a network at runtime (bad for air-gapped factory networks).
jsonschema = { version = "0.61", default-features = false, features = ["resolve-file"] }
thiserror = "2"

[build-dependencies]
serde_json = "1"
