# Mosquitto configuration for local development.
# NOTE: no authentication — development only. Production must use TLS +
# per-robot credentials and ACLs (see PLAN.md section 5 / risk table).
listener 1883
allow_anonymous true

# Keep the connection last-will messages so the gateway sees CONNECTION_BROKEN.
retain_available true

# Generous limits for state messages.
message_size_limit 1048576
