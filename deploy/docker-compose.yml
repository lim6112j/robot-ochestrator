# Development stack: MQTT broker + gateway + simulator.
#
#   docker compose -f deploy/docker-compose.yml up -d
#   open http://localhost:8080
#
services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: rcs-mosquitto
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./broker/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-t", "$$SYS/#", "-C", "1", "-i", "healthcheck", "-W", "3"]
      interval: 10s
      timeout: 5s
      retries: 5

  gateway:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.gateway
    container_name: rcs-gateway
    depends_on:
      mosquitto:
        condition: service_healthy
    environment:
      BROKER_HOST: mosquitto
      BROKER_PORT: "1883"
      HTTP_ADDR: 0.0.0.0:8080
      INTERFACE: vda5050
      MAJOR_VERSION: "3"
      ACCEPT_V2: "true"
      HEARTBEAT_TIMEOUT_S: "10"
      RUST_LOG: info
    ports:
      - "8080:8080"

volumes:
  mosquitto-data:
