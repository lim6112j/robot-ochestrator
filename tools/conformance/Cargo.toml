[package]
name = "conformance"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "VDA 5050 conformance test suite: schema verification and robot/fleet onboarding gate"

[[bin]]
name = "conformance"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
vda5050-types = { path = "../../crates/vda5050-types" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
